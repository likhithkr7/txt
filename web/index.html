<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <title>txt</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
    <script src="/theme.js"></script>
</head>
<body>
<div id="sidebar">
    <div id="masthead">
        txt
        <button id="btn-theme" class="icon-btn" type="button">
            <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5a6.5 6.5 0 0 0 10 10z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
    </div>
    <div id="tree-header">
        <span>Files</span>
        <div class="menu-wrap">
            <button id="btn-new" class="icon-btn" type="button" title="New file or folder"
                    aria-label="New file or folder" aria-haspopup="menu" aria-expanded="false">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <div id="new-menu" role="menu" hidden>
                <button id="btn-new-file" type="button" role="menuitem">
                    <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
                    New file
                </button>
                <button id="btn-new-dir" type="button" role="menuitem">
                    <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    New folder
                </button>
            </div>
        </div>
    </div>
    <div id="tree"></div>
</div>
<div id="main">
    <div id="tabbar">
        <div id="tabs" role="tablist"></div>
        <button id="btn-new-tab" class="icon-btn" type="button" title="New tab (Alt+N)" aria-label="New tab">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <!-- Shown only for .md tabs -->
        <div id="mode-switch" role="group" aria-label="Markdown view (Alt+P)" title="Markdown view (Alt+P)" hidden>
            <button type="button" data-mode="preview">Preview</button>
            <button type="button" data-mode="edit">Edit</button>
        </div>
    </div>
    <!-- One .pane (editor + Markdown preview) per tab, created by app.js -->
    <div id="editors"></div>
    <div id="statusbar">
        <span id="stat-path">No file open</span>
        <span id="stat-dirty"></span>
        <span class="stat-right">
            <button id="stat-update" type="button" hidden></button>
            <span id="stat-counts">0 lines | 0 chars</span>
        </span>
    </div>
</div>
<dialog id="dialog">
    <form method="dialog">
        <h2 id="dialog-title"></h2>
        <p id="dialog-message"></p>
        <input id="dialog-input" type="text" autocomplete="off" spellcheck="false">
        <div class="dialog-buttons">
            <button type="button" id="dialog-cancel" class="btn-secondary">Cancel</button>
            <button value="ok" id="dialog-ok" class="btn-primary">OK</button>
        </div>
    </form>
</dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
